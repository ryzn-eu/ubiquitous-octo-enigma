<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon OS - ERP Gestione Ordini & Servizi</title>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00e5ff;
            --primary-hover: #00b8d4;
            --bg: #0a0d14;
            --bg-card: #121824;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-light: #94a3b8;
            --accent: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        header h1 i {
            color: var(--primary);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        .data-table th, .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .data-table th {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-light);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .data-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-sm:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 680px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: modalFadeIn 0.2s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-body {
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="ph-fill ph-squares-four"></i> HORIZON OS - Gestionale Ordini</h1>
    </header>

    <div class="card">
        <h2 style="font-size:1.2rem; margin-bottom:16px; color:#fff; display:flex; align-items:center; gap:8px;">
            <i class="ph-fill ph-shopping-cart-simple" style="color:var(--primary);"></i> Ordini & Richieste Servizi
        </h2>
        <div class="table-responsive">
            <table id="table-ordini" class="data-table">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Cliente / CF</th>
                        <th>Servizio / Profilo</th>
                        <th>Indirizzo & Città</th>
                        <th>Importo</th>
                        <th>Stato</th>
                        <th>Azione</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="7" style="text-align:center; padding: 20px; color: var(--text-light);">Caricamento ordini in corso...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODALE DETTAGLIO ORDINE -->
<div id="modal-dettaglio-ordine" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="ph-fill ph-file-text" style="color:var(--primary);"></i> Scheda Dettaglio Ordine</h3>
            <button class="modal-close" onclick="closeModal('modal-dettaglio-ordine')">&times;</button>
        </div>
        <div class="modal-body" id="dettaglio-ordine-body">
            <!-- Popolato da JS -->
        </div>
    </div>
</div>

<!-- SDK Firebase (Versione Modulare) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Configurazione Firebase
    const firebaseConfig = {
        databaseURL: "https://vostra-database-url.firebaseio.com"
    };

    let app, db;
    try {
        app = initializeApp(firebaseConfig);
        db = getDatabase(app);
        window.db = db;
        window.rtdb = { ref, onValue, update };
        
        caricaOrdiniERP();
    } catch(e) {
        console.error("Errore Inizializzazione Firebase:", e);
    }

    // Funzioni Gestione Modale
    window.openModal = function(id) {
        const modal = document.getElementById(id);
        if (modal) modal.style.display = 'flex';
    };

    window.closeModal = function(id) {
        const modal = document.getElementById(id);
        if (modal) modal.style.display = 'none';
    };

    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    };

    // Realtime Listener per Ordini
    function caricaOrdiniERP() {
        if (!window.db || !window.rtdb) return;

        const ordiniRef = window.rtdb.ref(window.db, 'ordini');

        window.rtdb.onValue(ordiniRef, (snapshot) => {
            const tbody = document.querySelector('#table-ordini tbody');
            if (!tbody) return;
            tbody.innerHTML = '';

            const data = snapshot.val();
            if (!data) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 20px; color: var(--text-light);">Nessun ordine presente nel database.</td></tr>';
                return;
            }

            Object.keys(data).reverse().forEach((key) => {
                const ord = data[key];
                
                // Formattazione Data
                const dataStr = ord.timestamp 
                    ? new Date(ord.timestamp).toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) 
                    : 'N/D';

                // Indirizzo
                const indirizzoVisualizzato = ord.indirizzoCompleto 
                    || `${ord.indirizzo || 'N/D'} ${ord.citta ? `- ${ord.citta}` : ''} ${ord.provincia ? `(${ord.provincia})` : ''}`;

                // Cliente e CF
                const nomeCliente = ord.cliente || `${ord.nome || ''} ${ord.cognome || ''}`.trim() || 'Cliente Anonimo';
                const identificativoFiscale = ord.cf || ord.ragioneSociale || 'N/D';

                // Badge Stato
                let badgeStyle = 'background: rgba(245,158,11,0.15); color: #f59e0b;';
                if (ord.stato === 'In Lavorazione') badgeStyle = 'background: rgba(59,130,246,0.15); color: #3b82f6;';
                if (ord.stato === 'Attivo') badgeStyle = 'background: rgba(34,197,94,0.15); color: #22c55e;';
                if (ord.stato === 'Annullato') badgeStyle = 'background: rgba(239,68,68,0.15); color: #ef4444;';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><small style="color:var(--text-light);">${dataStr}</small></td>
                    <td>
                        <strong>${nomeCliente}</strong><br>
                        <small style="color:var(--text-light);">${identificativoFiscale}</small>
                    </td>
                    <td>
                        <span class="badge" style="background:rgba(0,229,255,0.1); color:var(--primary); font-weight:600;">
                            ${ord.servizio || 'Orion FWA'}
                        </span><br>
                        <small style="color:var(--text-light);">${ord.velocita || 'Fino a 1 Gbps'}</small>
                    </td>
                    <td>
                        <span style="font-size:0.85rem;" title="${indirizzoVisualizzato}">
                            <i class="ph-fill ph-map-pin" style="color:var(--primary);"></i> ${indirizzoVisualizzato}
                        </span>
                    </td>
                    <td><strong>${ord.importo || '29,90 €/mese'}</strong></td>
                    <td>
                        <span class="badge" style="${badgeStyle}">
                            ${ord.stato || 'Nuovo'}
                        </span>
                    </td>
                    <td class="action-btns">
                        <button class="btn-sm" style="background:var(--primary); color:#0a0d14;" 
                                onclick='apriDettaglioOrdine("${key}", ${JSON.stringify(ord).replace(/'/g, "&apos;").replace(/"/g, "&quot;")})'>
                            <i class="ph ph-eye"></i> Dettaglio
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });
    }

    // Modal Dettaglio Ordine
    window.apriDettaglioOrdine = function(key, ord) {
        const body = document.getElementById('dettaglio-ordine-body');
        if (!body) return;

        const dataStr = ord.timestamp ? new Date(ord.timestamp).toLocaleString('it-IT') : 'N/D';
        const nomeCliente = ord.cliente || `${ord.nome || ''} ${ord.cognome || ''}`.trim() || 'N/D';

        body.innerHTML = `
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                <!-- ANAGRAFICA -->
                <div style="background:rgba(255,255,255,0.02); padding:16px; border-radius:10px; border:1px solid var(--border-color);">
                    <p style="font-weight:700; color:var(--primary); font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:6px;">
                        <i class="ph-fill ph-user"></i> Anagrafica Cliente
                    </p>
                    <p style="margin-bottom:6px;"><strong>Nome / Ragione Soc.:</strong> ${nomeCliente}</p>
                    <p style="margin-bottom:6px;"><strong>CF / P.IVA:</strong> ${ord.cf || ord.ragioneSociale || 'N/D'}</p>
                    <p style="margin-bottom:6px;"><strong>Email:</strong> <a href="mailto:${ord.email || ''}" style="color:var(--primary); text-decoration:none;">${ord.email || 'N/D'}</a></p>
                    <p style="margin-bottom:0;"><strong>Telefono:</strong> <a href="tel:${ord.telefono || ''}" style="color:var(--primary); text-decoration:none;">${ord.telefono || 'N/D'}</a></p>
                </div>

                <!-- UBICAZIONE -->
                <div style="background:rgba(255,255,255,0.02); padding:16px; border-radius:10px; border:1px solid var(--border-color);">
                    <p style="font-weight:700; color:var(--primary); font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:6px;">
                        <i class="ph-fill ph-map-pin"></i> Indirizzo Installazione
                    </p>
                    <p style="margin-bottom:6px;"><strong>Via/Civico:</strong> ${ord.indirizzo || 'N/D'}</p>
                    <p style="margin-bottom:6px;"><strong>Città:</strong> ${ord.citta || 'N/D'}</p>
                    <p style="margin-bottom:6px;"><strong>Provincia / CAP:</strong> ${ord.provincia || 'N/D'} - ${ord.cap || 'N/D'}</p>
                    <p style="margin-bottom:0;"><strong>Indirizzo Completo:</strong> ${ord.indirizzoCompleto || `${ord.indirizzo \vert{}\vert{} ''},${ord.cap || ''} ${ord.citta \vert{}\vert{} ''} (${ord.provincia || ''})`}</p>
                </div>
            </div>

            <!-- OFFERTA E PROFILO -->
            <div style="background:rgba(255,255,255,0.02); padding:16px; border-radius:10px; border:1px solid var(--border-color); margin-bottom:16px;">
                <p style="font-weight:700; color:var(--primary); font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:6px;">
                    <i class="ph-fill ph-receipt"></i> Dettagli Profilo e Stato
                </p>
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px;">
                    <div>
                        <span style="font-size:0.8rem; color:var(--text-light);">Servizio</span>
                        <p><strong>${ord.servizio || 'Orion FWA'}</strong></p>
                    </div>
                    <div>
                        <span style="font-size:0.8rem; color:var(--text-light);">Velocità Profilo</span>
                        <p><strong>${ord.velocita || 'Fino a 1 Gbps'}</strong></p>
                    </div>
                    <div>
                        <span style="font-size:0.8rem; color:var(--text-light);">Canone Mensile</span>
                        <p><strong>${ord.importo || '29,90 €/mese'}</strong></p>
                    </div>
                </div>
                <p style="margin-top:10px; font-size:0.85rem; color:var(--text-light);">Data Registrazione: <strong>${dataStr}</strong></p>
            </div>

            <!-- CAMBIO STATO -->
            <div style="background:rgba(255,255,255,0.02); padding:16px; border-radius:10px; border:1px solid var(--border-color);">
                <label style="font-size:0.85rem; font-weight:700; display:block; margin-bottom:8px; color:#fff;">Cambia Stato Ordine:</label>
                <div style="display:flex; gap:10px;">
                    <select id="cambia-stato-ordine" style="flex:1; padding:10px; background:rgba(255,255,255,0.05); border:1px solid var(--border-color); color:#fff; border-radius:6px; outline:none;">
                        <option value="Nuovo" ${ord.stato === 'Nuovo' ? 'selected' : ''}>Nuovo</option>
                        <option value="In Lavorazione" ${ord.stato === 'In Lavorazione' ? 'selected' : ''}>In Lavorazione</option>
                        <option value="Attivo" ${ord.stato === 'Attivo' ? 'selected' : ''}>Attivo</option>
                        <option value="Annullato" ${ord.stato === 'Annullato' ? 'selected' : ''}>Annullato</option>
                    </select>
                    <button onclick="aggiornaStatoOrdine('${key}')" style="padding:10px 20px; background:var(--primary); color:#0a0d14; font-weight:700; border:none; border-radius:6px; cursor:pointer;">
                        Salva Stato
                    </button>
                </div>
            </div>
        `;

        window.openModal('modal-dettaglio-ordine');
    };

    // Salva lo stato su Firebase
    window.aggiornaStatoOrdine = async function(key) {
        const nuovoStato = document.getElementById('cambia-stato-ordine').value;
        try {
            await window.rtdb.update(window.rtdb.ref(window.db, `ordini/${key}`), { stato: nuovoStato });
            alert("Stato dell'ordine aggiornato correttamente.");
            window.closeModal('modal-dettaglio-ordine');
        } catch(e) {
            console.error("Errore aggiornamento stato:", e);
            alert("Errore durante l'aggiornamento dello stato.");
        }
    };
</script>

</body>
</html>
